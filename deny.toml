[graph]
all-features = true

[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste unmaintained
    # zstd 0.13 is pinned by foyer-storage until https://github.com/foyer-rs/foyer/pull/1382 is released.
    # foyer only uses `zstd::Encoder::new` and `zstd::read::Decoder::new`.
    { id = "RUSTSEC-2026-0391", reason = "foyer does not use `with_context`" },
    { id = "RUSTSEC-2026-0398", reason = "seekable feature is not enabled" },
    { id = "RUSTSEC-2026-0403", reason = "`zstd::read::Decoder` is not affected" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDDL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
deny = [
    { crate = "openssl", use-instead = "rustls-tls" },
    { crate = "openssl-sys", use-instead = "rustls-tls" },
    { crate = "ring", use-instead = "aws-lc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
