[graph]
all-features = true

[advisories]
ignore = [
    "RUSTSEC-2024-0436", # paste unmaintained
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar is unmaintained; only the testcontainers dev-dependency uses it, and no testcontainers release drops it" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDDL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
deny = [
    { crate = "openssl", use-instead = "rustls-tls" },
    { crate = "openssl-sys", use-instead = "rustls-tls" },
    { crate = "ring", use-instead = "aws-lc-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
